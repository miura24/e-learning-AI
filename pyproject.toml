[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e-learning-ai"
version = "0.1.0"
description = "Configurable browser automation tool for e-learning assignments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.60.0",
]

[project.scripts]
e-learning-ai = "elearning_ai.cli:main"

[tool.setuptools.packages.find]
include = ["elearning_ai*"]
